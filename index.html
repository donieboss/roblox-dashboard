<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DONIE Rich Finder</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #08080d;
  color: white;
}

header {
  text-align: center;
  padding: 35px 20px;
  background: #11111b;
  border-bottom: 1px solid #29293a;
}

h1 {
  margin: 0;
  font-size: 38px;
}

header p {
  color: #999;
}

.container {
  width: 92%;
  max-width: 1200px;
  margin: 30px auto;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 18px;
  color: white;
  background: #5865f2;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .85;
}

.status {
  background: #11111b;
  border: 1px solid #29293a;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
}

.servers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}

.server {
  background: #11111b;
  border: 1px solid #303044;
  border-radius: 18px;
  padding: 20px;
}

.server.rich {
  border-color: #00e676;
}

.server h2 {
  margin-top: 0;
}

.badge {
  display: inline-block;
  background: #00a86b;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 15px;
}

.stat {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #292936;
}

.join {
  width: 100%;
  margin-top: 18px;
  background: #00a86b;
}

.empty {
  text-align: center;
  padding: 50px;
  background: #11111b;
  border-radius: 15px;
  color: #999;
}
</style>
</head>

<body>

<header>
  <h1>🔥 DONIE RICH FINDER</h1>
  <p>Find busy Roblox servers fast</p>
</header>

<div class="container">

  <div class="controls">
    <button onclick="loadServers(20)">👥 20+ Players</button>
    <button onclick="loadServers(30)">🔥 30+ Players</button>
    <button onclick="loadServers(35)">💎 35/35 Servers</button>
    <button onclick="loadServers(0)">🔄 Show All</button>
  </div>

  <div id="status" class="status">
    🔎 Loading servers...
  </div>

  <div id="servers" class="servers"></div>

</div>

<script>

const WORKER_URL =
"https://black-sun-c74c.redonekowaithe1.workers.dev";

const PLACE_ID = "920587237";

async function loadServers(minPlayers = 20) {

  const status = document.getElementById("status");
  const container = document.getElementById("servers");

  status.innerHTML = "🔎 Finding servers...";
  container.innerHTML = "";

  try {

    const response = await fetch(
      WORKER_URL + "/servers"
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const result = await response.json();

    console.log(result);

    if (!result.success) {
      throw new Error(result.error || "Worker error");
    }

    let servers = result.data || [];

    servers = servers.filter(server => {

      const players = Number(server.playing || 0);
      const max = Number(server.maxPlayers || 0);

      if (minPlayers === 35) {
        return players === 35 && max === 35;
      }

      return players >= minPlayers;
    });

    servers.sort((a, b) => {

      const playersA = Number(a.playing || 0);
      const playersB = Number(b.playing || 0);

      return playersB - playersA;

    });

    status.innerHTML =
      `🟢 Found <b>${servers.length}</b> servers`;

    if (servers.length === 0) {

      container.innerHTML = `
        <div class="empty">
          ❌ No servers found.
        </div>
      `;

      return;
    }

    servers.forEach(server => {

      const players =
        Number(server.playing || 0);

      const maxPlayers =
        Number(server.maxPlayers || 0);

      const percent =
        maxPlayers > 0
        ? Math.round((players / maxPlayers) * 100)
        : 0;

      const rich =
        players >= 30;

      const card =
        document.createElement("div");

      card.className =
        "server" + (rich ? " rich" : "");

      card.innerHTML = `

        <h2>🎮 Roblox Server</h2>

        <span class="badge">
          ${rich ? "🟢 RICH SERVER" : "SERVER"}
        </span>

        <div class="stat">
          <span>👥 Players</span>
          <b>${players}/${maxPlayers}</b>
        </div>

        <div class="stat">
          <span>📊 Fullness</span>
          <b>${percent}%</b>
        </div>

        <div class="stat">
          <span>📡 Ping</span>
          <b>${server.ping ?? "N/A"} ms</b>
        </div>

        <div class="stat">
          <span>⚡ FPS</span>
          <b>${server.fps ?? "N/A"}</b>
        </div>

        <button
          class="join"
          onclick="joinServer('${server.id}')">

          🚀 JOIN SERVER

        </button>
      `;

      container.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Could not connect to Worker.";

    container.innerHTML = `
      <div class="empty">
        Worker connection failed.<br><br>
        ${error.message}
      </div>
    `;
  }
}

function joinServer(serverId) {

  const url =
    "https://www.roblox.com/games/start" +
    "?placeId=" + encodeURIComponent(PLACE_ID) +
    "&gameInstanceId=" + encodeURIComponent(serverId);

  window.open(url, "_blank");
}

loadServers(20);

</script>

</body>
</html>
