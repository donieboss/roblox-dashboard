```html
<script>

const WORKER_URL =
    "https://black-sun-c74c.redonekowaithe1.workers.dev";

const PLACE_ID = "920587237";

/* Only show servers with 20+ players */
const MIN_PLAYERS = 20;

async function loadServers() {

    const list = document.getElementById("serverList");

    list.innerHTML = `
        <div class="loading">
            🔄 Loading real Roblox servers...
        </div>
    `;

    try {

        const response = await fetch(
            `${WORKER_URL}/servers?placeId=${PLACE_ID}`
        );

        if (!response.ok) {
            throw new Error(
                `Worker returned HTTP ${response.status}`
            );
        }

        const data = await response.json();

        /*
         * Get servers from Worker.
         */
        let allServers = Array.isArray(data.data)
            ? data.data
            : [];

        /*
         * ONLY KEEP SERVERS WITH 20+ PLAYERS.
         */
        let servers = allServers.filter(server =>
            Number(server.playing || 0) >= MIN_PLAYERS
        );

        /*
         * BUSIEST SERVERS FIRST.
         */
        servers.sort((a, b) =>
            Number(b.playing || 0) -
            Number(a.playing || 0)
        );

        /*
         * UPDATE STATS.
         */
        document.getElementById("totalServers").textContent =
            servers.length;

        document.getElementById("adoptServers").textContent =
            servers.length;

        const totalPlayers = servers.reduce(
            (total, server) =>
                total + Number(server.playing || 0),
            0
        );

        document.getElementById("totalPlayers").textContent =
            totalPlayers;

        document.getElementById("playersFound").textContent =
            totalPlayers;

        /*
         * NO 20+ SERVERS FOUND.
         */
        if (servers.length === 0) {

            list.innerHTML = `
                <div class="loading">

                    ⚠️ No public servers with
                    <strong>20+ players</strong>
                    were returned by the Worker.

                    <br><br>

                    Worker returned:
                    <strong>${allServers.length}</strong>
                    servers.

                    <br><br>

                    Those servers currently have fewer
                    than 20 players.

                    <br><br>

                    ↻ Click Refresh to check again.

                </div>
            `;

            return;
        }

        /*
         * CREATE SERVER CARDS.
         */
        list.innerHTML = "";

        servers.forEach((server, index) => {

            const div = document.createElement("div");

            div.className = "server";

            /*
             * SERVER TOP.
             */
            const top = document.createElement("div");

            top.className = "server-top";

            const title = document.createElement("strong");

            title.textContent =
                index === 0
                    ? "🔥 BUSIEST SERVER"
                    : "🟢 Public Server";

            const players = document.createElement("span");

            players.className = "players";

            players.textContent =
                `${Number(server.playing || 0)}/${Number(server.maxPlayers || 0)} Players`;

            top.appendChild(title);
            top.appendChild(players);

            /*
             * SERVER ID.
             */
            const id = document.createElement("div");

            id.className = "server-id";

            id.innerHTML = "Server ID:<br>";

            id.appendChild(
                document.createTextNode(
                    server.id || "Unknown"
                )
            );

            /*
             * SERVER PERFORMANCE.
             */
            const info = document.createElement("div");

            info.style.marginTop = "12px";
            info.style.color = "#aaa";
            info.style.fontSize = "13px";

            const ping =
                server.ping !== undefined
                    ? `${Math.round(Number(server.ping))} ms`
                    : "N/A";

            const fps =
                server.fps !== undefined
                    ? `${Math.round(Number(server.fps))} FPS`
                    : "N/A";

            info.textContent =
                `📡 Ping: ${ping}    |    🎮 FPS: ${fps}`;

            /*
             * JOIN BUTTON.
             */
            const button =
                document.createElement("button");

            button.className = "join";

            button.textContent =
                "🚀 JOIN SERVER";

            button.addEventListener("click", () => {
                joinServer(server.id);
            });

            /*
             * BUILD CARD.
             */
            div.appendChild(top);
            div.appendChild(id);
            div.appendChild(info);
            div.appendChild(button);

            list.appendChild(div);

        });

    } catch (error) {

        console.error("Server loading error:", error);

        list.innerHTML = `

            <div class="error">

                ❌ Could not load Roblox servers.

                <br><br>

                ${error.message}

                <br><br>

                <button
                    class="refresh"
                    onclick="loadServers()"
                >
                    ↻ Try Again
                </button>

            </div>

        `;

    }

}

/*
 * OPEN ROBLOX SERVER.
 */
function joinServer(serverId) {

    if (!serverId) {

        alert("Server ID is missing.");

        return;
    }

    const robloxLink =
        `roblox://placeId=${PLACE_ID}&gameInstanceId=${encodeURIComponent(serverId)}`;

    window.location.href = robloxLink;

}

/*
 * DASHBOARD BUTTON.
 */
function showDashboard() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

/*
 * GAME BUTTON.
 */
function showGame(game) {

    if (game === "Adopt Me") {

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    } else {

        alert(
            `${game} server support is not connected yet.`
        );

    }

}

/*
 * LOAD SERVERS WHEN PAGE OPENS.
 */
loadServers();

</script>
```
