<script>
/* =========================================
   DONIE RICH FINDER - FIXED
   ========================================= */

const WORKER_URL="https://black-sun-c74c.redonekowaithe1.workers.dev";

const GAMES={
  "Adopt Me":"920587237",
  "Blade Ball":"13772394625",
  "MM2":"",
  "Pet Simulator 99":""
};

let selected="Adopt Me";
let all=[];
let autoTimer=null;

/*
  IMPORTANT:
  Normal Roblox servers have value/rap = 0.
  Therefore the dashboard starts by showing ALL
  live Roblox servers instead of hiding them.
*/
let highOnly=false;

/* ---------- HELPERS ---------- */

const $=id=>document.getElementById(id);

function toast(msg){
  $("toast").textContent=msg;
  $("toast").classList.add("show");
  clearTimeout(window._toast);
  window._toast=setTimeout(
    ()=>$("toast").classList.remove("show"),
    2200
  );
}

function num(v){
  const n=Number(v);
  return Number.isFinite(n)?n:0;
}

function valueOf(s){
  return num(
    s.value ??
    s.rap ??
    s.RAP ??
    s.totalRap ??
    s.totalValue ??
    s.reportedValue ??
    s.serverValue
  );
}

function playersOf(s){
  return num(
    s.players ??
    s.playing ??
    s.playerCount ??
    s.currentPlayers
  );
}

function maxPlayersOf(s){
  return num(
    s.maxPlayers ??
    s.maxPlayersAllowed ??
    s.capacity
  ) || 48;
}

function fpsOf(s){
  return num(s.fps ?? s.FPS);
}

function pingOf(s){
  return num(s.ping ?? s.Ping);
}

function idOf(s){
  return String(
    s.id ??
    s.jobId ??
    s.serverId ??
    s.instanceId ??
    s.guid ??
    "unknown"
  );
}

function updatedOf(s){
  let v=s.updatedAt ?? s.timestamp ?? s.createdAt ?? 0;

  if(typeof v==="string"){
    const parsed=Date.parse(v);
    if(!Number.isNaN(parsed)) return parsed;
  }

  return num(v);
}

function money(v){
  v=num(v);

  if(v>=1000000)
    return "$"+(v/1000000).toFixed(1).replace(".0","")+"M";

  if(v>=1000)
    return "$"+(v/1000).toFixed(1).replace(".0","")+"K";

  return "$"+v.toLocaleString();
}

function esc(v){
  return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ---------- GAME ---------- */

function selectGame(game){

  selected=game;

  $("selectedGame").textContent=game;

  document.querySelectorAll(".game").forEach(x=>{
    x.classList.toggle(
      "selected",
      x.dataset.game===game
    );
  });

  toast(game+" selected");

  if(GAMES[game]){
    refreshServers();
  }
}

/* ---------- SERVER REQUEST ---------- */

async function refreshServers(){

  const status=$("scanStatus");

  status.textContent="Scanning";
  status.className="badge";

  const place=GAMES[selected];

  if(!place){

    status.textContent="No ID";

    all=[];

    render();
    updateHits();

    toast(selected+" has no Place ID configured");

    return;
  }

  try{

    /*
      FIX #1:
      Use the WORKING /servers endpoint.
    */
    const url=
      WORKER_URL.replace(/\/$/,"")+
      "/servers?placeId="+
      encodeURIComponent(place);

    console.log("DONIE requesting:",url);

    const r=await fetch(url,{
      method:"GET",
      headers:{
        "Accept":"application/json"
      },
      cache:"no-store"
    });

    /*
      Read the response as text first so a Cloudflare
      error page cannot cause an unexplained JSON error.
    */
    const text=await r.text();

    let data;

    try{
      data=JSON.parse(text);
    }catch(err){
      console.error("Worker returned non-JSON:",text);
      throw new Error(
        "Worker returned invalid JSON"
      );
    }

    if(!r.ok){
      throw new Error(
        data.error ||
        data.message ||
        ("HTTP "+r.status)
      );
    }

    if(data.success===false){
      throw new Error(
        data.error ||
        data.message ||
        "Worker request failed"
      );
    }

    /*
      Accept the response format from your Worker.
    */
    if(Array.isArray(data.servers)){
      all=data.servers;
    }else if(Array.isArray(data.data)){
      all=data.data;
    }else{
      all=[];
    }

    console.log(
      "DONIE servers received:",
      all.length,
      data
    );

    status.textContent=
      "Live • "+all.length;

    status.className="badge green";

    render();
    updateStats();
    updateHits();

    toast(all.length+" server(s) loaded");

  }catch(e){

    console.error("DONIE Worker error:",e);

    all=[];

    status.textContent="Error";
    status.className="badge";

    render();
    updateStats();
    updateHits();

    toast(
      "Worker error: "+
      (e.message||"request failed")
    );
  }
}

/* ---------- FILTER ---------- */

function filtered(){

  const playerMin=Math.max(
    num($("players").value),
    num($("minPlayers").value)
  );

  const manualValue=num($("value").value);
  const configValue=num($("minValue").value);

  /*
    When High Value is OFF:
    show normal Roblox servers.

    When High Value is ON:
    only show servers with 17K+ reported value.
  */
  let minimum=manualValue;

  if(highOnly){
    minimum=Math.max(
      17000,
      configValue,
      manualValue
    );
  }

  let list=all.filter(s=>{

    const players=playersOf(s);
    const value=valueOf(s);

    return (
      players>=playerMin &&
      value>=minimum
    );
  });

  const sort=$("sort").value;

  list.sort((a,b)=>{

    if(sort==="players")
      return playersOf(b)-playersOf(a);

    if(sort==="value")
      return valueOf(b)-valueOf(a);

    if(sort==="fps")
      return fpsOf(b)-fpsOf(a);

    if(sort==="ping"){
      return (
        (pingOf(a)||9999)-
        (pingOf(b)||9999)
      );
    }

    return updatedOf(b)-updatedOf(a);
  });

  return list;
}

/* ---------- RENDER ---------- */

function render(){

  const list=$("serverList");
  const data=filtered();

  if(!data.length){

    if(all.length){

      if(highOnly){

        list.innerHTML=
          '<div class="empty">'+
          '<b>No 17K+ reported servers found.</b><br>'+
          'Turn off <b>17K+ High Value</b> to see all live Roblox servers.'+
          '</div>';

      }else{

        list.innerHTML=
          '<div class="empty">'+
          'No servers match your player/filter settings.'+
          '</div>';
      }

    }else{

      list.innerHTML=
        '<div class="empty">'+
        'Press <b>Scan Servers</b> to load live results.'+
        '</div>';
    }

    updateStats();

    return;
  }

  list.innerHTML=data.map(s=>{

    const id=idOf(s);
    const p=playersOf(s);
    const max=maxPlayersOf(s);
    const value=valueOf(s);
    const fps=fpsOf(s);
    const ping=pingOf(s);

    const valueLabel=
      value>0
      ?money(value)
      :"Unreported";

    const fpsLabel=
      fps>0
      ?fps.toFixed(1)
      :"—";

    const pingLabel=
      ping>0
      ?ping+"ms"
      :"—";

    return `
      <div class="server">

        <div>
          <b>${esc(selected)} Server</b>
          <small>${esc(id)}</small>
        </div>

        <div class="sstat">
          <span>Players</span>
          ${p}/${max}
        </div>

        <div class="sstat">
          <span>Value</span>
          ${valueLabel}
        </div>

        <div class="sstat">
          <span>FPS</span>
          ${fpsLabel}
        </div>

        <div class="sstat">
          <span>Ping</span>
          ${pingLabel}
        </div>

        <button
          class="join"
          onclick="joinServer(${JSON.stringify(id)})">
          Join
        </button>

      </div>
    `;

  }).join("");

  updateStats();
}

/* ---------- STATS ---------- */

function updateStats(){

  /*
    Servers = currently displayed servers.
  */
  const data=filtered();

  $("serverCount").textContent=data.length;

  $("playerCount").textContent=
    data.reduce(
      (total,s)=>total+playersOf(s),
      0
    );

  /*
    17K+ count is calculated from ALL
    received servers, not only the current
    filter.
  */
  $("hitCount").textContent=
    all.filter(
      s=>valueOf(s)>=17000
    ).length;

  const highest=all.reduce(
    (max,s)=>Math.max(
      max,
      valueOf(s)
    ),
    0
  );

  $("highestValue").textContent=
    money(highest);
}

/* ---------- RECENT HITS ---------- */

function updateHits(){

  const rich=[...all]
    .filter(
      s=>valueOf(s)>=17000
    )
    .sort(
      (a,b)=>valueOf(b)-valueOf(a)
    )
    .slice(0,4);

  if(!rich.length){

    $("recentHits").innerHTML=`
      <div class="alert">
        <b>No 17K+ reports yet</b>
        <small>
          Live Roblox servers are shown normally.
          Rich values appear when your reporter sends data.
        </small>
        <strong>—</strong>
      </div>
    `;

    return;
  }

  $("recentHits").innerHTML=
    rich.map(s=>`

      <div class="alert">

        <b>${esc(selected)} rich server</b>

        <small>
          ${playersOf(s)} players •
          ${pingOf(s)||"—"}ms ping
        </small>

        <strong>
          ${money(valueOf(s))}
        </strong>

      </div>

    `).join("");
}

/* ---------- JOIN ---------- */

function joinServer(id){

  const place=GAMES[selected];

  if(
    !place ||
    !id ||
    id==="unknown"
  ){
    toast("Server ID unavailable");
    return;
  }

  /*
    Roblox decides whether the specific
    public server can be opened.
  */
  const url=
    "https://www.roblox.com/games/start"+
    "?placeId="+
    encodeURIComponent(place)+
    "&gameInstanceId="+
    encodeURIComponent(id);

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}

/* ---------- CONTROLS ---------- */

function applyFilters(){

  render();
  updateStats();
}

function toggleHigh(){

  highOnly=!highOnly;

  $("highToggle")
    .classList
    .toggle(
      "on",
      highOnly
    );

  render();
  updateStats();

  toast(
    highOnly
      ? "17K+ filter enabled"
      : "Showing all live servers"
  );
}

function toggleAuto(){

  const el=$("autoToggle");

  if(el.classList.contains("on")){

    el.classList.remove("on");

    clearInterval(autoTimer);

    autoTimer=null;

    toast("Auto refresh disabled");

    return;
  }

  el.classList.add("on");

  refreshServers();

  autoTimer=setInterval(
    refreshServers,
    30000
  );

  toast("Auto refresh enabled");
}

function clearServers(){

  all=[];

  $("scanStatus").textContent="Cleared";
  $("scanStatus").className="badge";

  render();
  updateHits();

  toast("Server list cleared");
}

/* ---------- NAV ---------- */

document
  .querySelectorAll(
    ".nav button[data-page]"
  )
  .forEach(btn=>{

    btn.onclick=()=>{

      document
        .querySelectorAll(
          ".nav button[data-page]"
        )
        .forEach(x=>
          x.classList.remove("active")
        );

      btn.classList.add("active");

      $("pageTitle").textContent=
        btn.dataset.page;

      $("side")
        .classList
        .remove("open");
    };
  });

/* ---------- FILTER EVENTS ---------- */

[
  "sort",
  "players",
  "value",
  "minValue",
  "minPlayers"
].forEach(id=>{

  $(id).addEventListener(
    "input",
    applyFilters
  );

  $(id).addEventListener(
    "change",
    applyFilters
  );
});

/* ---------- START ---------- */

render();
updateStats();
updateHits();

/*
  Automatically scan when the dashboard loads.
  This removes the need to press Scan manually.
*/
refreshServers();

</script>
