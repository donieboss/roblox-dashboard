<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adopt Me Trading Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0b0f19;
    color: white;
    min-height: 100vh;
}

header {
    background: #111827;
    padding: 22px 35px;
    border-bottom: 1px solid #263044;
}

header h1 {
    font-size: 25px;
}

header p {
    color: #8f9bb3;
    margin-top: 6px;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.top-card {
    background: #111827;
    border: 1px solid #263044;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 25px;
}

.top-card h2 {
    margin-bottom: 10px;
}

.description {
    color: #8f9bb3;
}

.controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
}

input {
    background: #080c14;
    color: white;
    border: 1px solid #303b52;
    padding: 13px;
    border-radius: 9px;
    outline: none;
    width: 180px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 13px 18px;
    font-weight: bold;
    cursor: pointer;
}

.find-btn {
    background: #5865f2;
    color: white;
}

.server-list {
    display: grid;
    gap: 18px;
}

.server-card {
    background: #111827;
    border: 1px solid #263044;
    border-radius: 16px;
    padding: 22px;
}

.player {
    font-size: 20px;
    font-weight: bold;
}

.value {
    color: #8b9cff;
    font-size: 18px;
    margin-left: 8px;
}

.status {
    display: inline-block;
    margin-top: 14px;
    padding: 7px 11px;
    border-radius: 20px;
    background: #123b29;
    color: #5dff9a;
    font-size: 13px;
    font-weight: bold;
}

.details {
    margin-top: 17px;
    color: #aab4c7;
    line-height: 1.8;
}

.server-id {
    background: #080c14;
    padding: 10px;
    border-radius: 7px;
    color: #d7def0;
    word-break: break-all;
    margin-top: 5px;
}

.join {
    margin-top: 18px;
    background: #20c77a;
    color: #06130c;
    width: 100%;
}

.join:hover {
    background: #35e58f;
}

.empty {
    display: none;
    text-align: center;
    color: #8f9bb3;
    padding: 40px;
    background: #111827;
    border-radius: 16px;
}

.note {
    margin-top: 20px;
    color: #78849b;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>🎮 Adopt Me Trading Dashboard</h1>
    <p>High-value trading server finder</p>
</header>

<div class="container">

    <div class="top-card">
        <h2>🎯 High Value Servers</h2>

        <p class="description">
            Find servers meeting your minimum value.
        </p>

        <div class="controls">
            <input
                id="minimumValue"
                type="number"
                min="0"
                step="0.01"
                value="2.00"
                placeholder="Minimum value"
            >

            <button
                type="button"
                class="find-btn"
                onclick="findServers()"
            >
                🔎 Find High Value Servers
            </button>
        </div>

        <p class="note">
            Servers below your selected value will be hidden.
        </p>
    </div>

    <div id="serverList" class="server-list"></div>

    <div id="empty" class="empty">
        ❌ No high-value servers found.
    </div>

</div>

<script>

/*
==================================================
ADOPT ME PLACE
==================================================
*/

const PLACE_ID = "920587237";


/*
==================================================
SERVER DATA
==================================================

Replace the example serverId values with REAL
Roblox server instance IDs from your legitimate
server data source.
*/

const servers = [

    {
        player: "@PlayerOne",
        value: 3.80,
        game: "Adopt Me",
        serverId: "example-server-001"
    },

    {
        player: "@RichTrader",
        value: 4.95,
        game: "Adopt Me",
        serverId: "example-server-002"
    },

    {
        player: "@TradingKing",
        value: 2.75,
        game: "Adopt Me",
        serverId: "example-server-003"
    },

    {
        player: "@PetCollector",
        value: 2.10,
        game: "Adopt Me",
        serverId: "example-server-004"
    }

];


/*
==================================================
FIND SERVERS
==================================================
*/

function findServers() {

    const input =
        document.getElementById("minimumValue");

    const minimum =
        parseFloat(input.value) || 2.00;

    const list =
        document.getElementById("serverList");

    const empty =
        document.getElementById("empty");

    list.innerHTML = "";

    const filtered =
        servers
        .filter(server => server.value >= minimum)
        .sort((a, b) => b.value - a.value);

    if (filtered.length === 0) {

        empty.style.display = "block";

        return;
    }

    empty.style.display = "none";


    filtered.forEach(server => {

        const card =
            document.createElement("div");

        card.className = "server-card";

        card.innerHTML = `

            <div class="player">
                👤 ${server.player}

                <span class="value">
                    ${server.value.toFixed(2)} Value
                </span>
            </div>

            <div class="status">
                🟢 Rich Server Detected!
            </div>

            <div class="details">

                🎮 Game:
                <strong>${server.game}</strong>

                <br>

                🆔 Server ID:

                <div class="server-id">
                    ${server.serverId}
                </div>

            </div>

            <button
                type="button"
                class="join"
                onclick="joinRobloxServer('${server.serverId}')"
            >
                🚀 JOIN SERVER
            </button>

        `;

        list.appendChild(card);

    });

}


/*
==================================================
JOIN ROBLOX SERVER
==================================================
*/

function joinRobloxServer(serverId) {

    if (
        !serverId ||
        serverId.startsWith("example-")
    ) {

        alert(
            "⚠️ This is an example server.\n\n" +
            "Add a real Roblox server instance ID " +
            "before using JOIN SERVER."
        );

        return;
    }


    /*
    Roblox application deep link
    */

    const robloxLink =
        "roblox://placeId=" +
        PLACE_ID +
        "&gameInstanceId=" +
        encodeURIComponent(serverId);


    /*
    Try opening Roblox
    */

    window.location.href = robloxLink;

}


/*
==================================================
LOAD SERVERS
==================================================
*/

findServers();

</script>

</body>
</html>
