```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rich Server Detector</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at top, #12351f 0%, #090b0a 45%);
    color: white;
    min-height: 100vh;
}

.header {
    text-align: center;
    padding: 35px 15px 20px;
}

.header h1 {
    font-size: 32px;

}

.header p {
    color: #8d9a91;

}

    width: fit-content;
    margin: 18px auto;
    padding: 8px 15px;
    border-radius: 20px;

    max-width: 900px;

<body>

<div class="header">

    <h1>💎 Rich Server Detector</h1>

    <p>Find busy Roblox servers and join them instantly</p>

    <div class="status">
        🟢 LIVE SERVER SCANNER
    </div>

</div>

<div class="controls">

    <div class="server-count" id="serverCount">
        Scanning servers...
    </div>

    <button class="refresh" onclick="loadServers()">
        🔄 Scan Servers
    </button>

</div>

<div id="serverList">

    <div class="loading">
        🔄 Finding rich servers...
    </div>

</div>

<script>

const WORKER_URL =
    "https://red-mouse-29f4.redonekowaithe1.workers.dev";

const PLACE_ID =
    "920587237";

/*
 * Only show servers with 20+
 * players.
 */
const MIN_PLAYERS = 20;


/*
 * Calculate a simple server value.
 *
 * More players = higher value.
 *
 * This is a dashboard score,
 * not an actual Roblox item/value.
 */
function calculateValue(server) {

    const playing =
        Number(server.playing || 0);

    const maxPlayers =
        Number(server.maxPlayers || 0);

    if (!maxPlayers) {
        return playing;
    }

    const fullness =
        playing / maxPlayers;

    return (
        playing * 0.08 +
        fullness * 5
    ).toFixed(2);
}


/*
 * Load servers.
 */
async function loadServers() {

    const list =
        document.getElementById("serverList");

    const count =
        document.getElementById("serverCount");

    count.textContent =
        "🔄 Scanning...";

    list.innerHTML = `
        <div class="loading">
            🔄 Finding rich Roblox servers...
        </div>
    `;

    try {

        const response =
            await fetch(
                `${WORKER_URL}/servers?placeId=${PLACE_ID}`
            );

        if (!response.ok) {

            throw new Error(
                `Worker returned HTTP ${response.status}`
            );

        }

        const data =
            await response.json();

        let allServers =
            Array.isArray(data.data)
                ? data.data
                : [];


        /*
         * Keep only 20+ player servers.
         */
        let servers =
            allServers.filter(server => {

                return Number(
                    server.playing || 0
                ) >= MIN_PLAYERS;

            });


        /*
         * Sort:
         *
         * 1. Most players
         * 2. Highest value
         */
        servers.sort((a, b) => {

            const playerDifference =
                Number(b.playing || 0) -
                Number(a.playing || 0);

            if (playerDifference !== 0) {
                return playerDifference;
            }

            return calculateValue(b) -
                   calculateValue(a);

        });


        count.textContent =
            `🟢 ${servers.length} rich servers found`;


        /*
         * No servers.
         */
        if (servers.length === 0) {

            list.innerHTML = `
                <div class="empty">

                    ⚠️ No 20+ player servers
                    were returned right now.

                    <br><br>

                    Worker returned
                    <strong>
                        ${allServers.length}
                    </strong>
                    servers.

                    <br><br>

                    Try scanning again.

                </div>
            `;

            return;
        }


        /*
         * Create cards.
         */
        list.innerHTML = "";


        servers.forEach((server, index) => {

            const playing =
                Number(server.playing || 0);

            const maxPlayers =
                Number(server.maxPlayers || 0);

            const ping =
                server.ping !== undefined
                    ? Math.round(
                        Number(server.ping)
                      )
                    : null;

            const fps =
                server.fps !== undefined
                    ? Math.round(
                        Number(server.fps)
                      )
                    : null;

            const value =
                calculateValue(server);


            const div =
                document.createElement("div");

            div.className =
                "server rich";


            /*
             * Badge.
             */
            const badge =
                document.createElement("div");

            badge.className =
                "badge";

            badge.textContent =
                index === 0
                    ? "🔥 BEST RICH SERVER"
                    : "🟢 RICH SERVER DETECTED";


            /*
             * Top section.
             */
            const top =
                document.createElement("div");

            top.className =
                "server-top";


            const title =
                document.createElement("div");

            title.className =
                "server-title";

            title.textContent =
                `🎮 Roblox Server #${index + 1}`;


            const players =
                document.createElement("div");

            players.className =
                "players";

            players.textContent =
                `👥 ${playing}/${maxPlayers}`;


            top.appendChild(title);
            top.appendChild(players);


            /*
             * Value.
             */
            const valueBox =
                document.createElement("div");

            valueBox.className =
                "value";

            valueBox.innerHTML = `
                <div class="value-label">
                    Server Value
                </div>
                💎 ${value}
            `;


            /*
             * Rich message.
             */
            const message =
                document.createElement("div");

            message.className =
                "rich-message";

            message.textContent =
                playing >= maxPlayers
                    ? "🔥 FULL SERVER DETECTED!"
                    : "🟢 Rich Server Detected!";


            /*
             * Server ID.
             */
            const id =
                document.createElement("div");

            id.className =
                "server-id";

            id.innerHTML =
                `Server ID:<br><span></span>`;

            id.querySelector("span")
                .textContent =
                    server.id || "Unknown";


            /*
             * Performance info.
             */
            const info =
                document.createElement("div");

            info.className =
                "info";


            const pingText =
                ping !== null
                    ? `📡 Ping: ${ping} ms`
                    : "📡 Ping: N/A";


            const fpsText =
                fps !== null
                    ? `⚡ FPS: ${fps}`
                    : "⚡ FPS: N/A";


            info.innerHTML = `
                <span>${pingText}</span>
                <span>${fpsText}</span>
                <span>👥 ${playing} players</span>
            `;


            /*
             * Join button.
             */
            const button =
                document.createElement("button");

            button.className =
                "join";

            button.textContent =
                "🚀 JOIN SERVER";


            button.addEventListener(
                "click",
                () => {

                    joinServer(
                        server.id
                    );

                }
            );


            /*
             * Build card.
             */
            div.appendChild(badge);
            div.appendChild(top);
            div.appendChild(valueBox);
            div.appendChild(message);
            div.appendChild(id);
            div.appendChild(info);
            div.appendChild(button);

            list.appendChild(div);

        });


    } catch (error) {

        console.error(
            "Server loading error:",
            error
        );


        count.textContent =
            "❌ Scanner error";


        list.innerHTML = `

            <div class="error">

                ❌ Could not load Roblox servers.

                <br><br>

                ${error.message}

                <br><br>

                <button
                    class="refresh"
                    onclick="loadServers()"
                >
                    🔄 Try Again
                </button>

            </div>

        `;

    }

}


/*
 * Join a specific Roblox server.
 */
function joinServer(serverId) {

    if (!serverId) {

        alert(
            "Server ID is missing."
        );

        return;

    }


    const robloxLink =
        `roblox://placeId=${PLACE_ID}&gameInstanceId=${encodeURIComponent(serverId)}`;


    window.location.href =
        robloxLink;

}


/*
 * Initial scan.
 */
loadServers();


/*
 * Automatically scan every 30 seconds.
 */
setInterval(
    loadServers,
    30000
);

</script>

</body>
</html>
