
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Rich Server Finder</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #090b10;
    color: white;
}

.sidebar {
    position: fixed;
    width: 230px;
    height: 100vh;
    background: #0e1117;
    border-right: 1px solid #252a33;
    padding: 25px 15px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    padding: 10px 15px 30px;
}

.logo span {
    color: #00ff88;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.nav a {
    color: #999;
    text-decoration: none;
    padding: 13px 15px;
    border-radius: 9px;
}

.nav a:hover,
.nav a.active {
    background: #181d26;
    color: white;
}

.main {
    margin-left: 230px;
    padding: 35px;
    max-width: 1100px;
}

.header {
    margin-bottom: 25px;
}

.header h1 {
    font-size: 30px;
}

.header p {
    color: #858b98;
    margin-top: 8px;
}

.search-box {
    background: #10141b;
    border: 1px solid #252b35;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 25px;
}

.search-box input {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #303640;
    background: #080a0e;
    color: white;
    outline: none;
}

.server {
    background: #17191f;
    border: 1px solid #30343d;
    border-left: 4px solid #3b82f6;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
}

.server-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.server-title h2 {
    font-size: 18px;
}

.rich {
    background: #00ff88;
    color: #06100a;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
}

.info {
    color: #bbb;
    line-height: 1.8;
}

.value {
    color: #00ff88;
    font-weight: bold;
}

.server-id {
    background: #252833;
    color: #ddd;
    display: inline-block;
    padding: 5px 8px;
    border-radius: 5px;
    font-family: monospace;
    font-size: 12px;
}

.players {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.player {
    background: #20232b;
    border: 1px solid #30343d;
    border-radius: 7px;
    padding: 8px 11px;
    font-size: 13px;
}

.actions {
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    font-weight: bold;
    cursor: pointer;
}

.join {
    background: #00ff88;
    color: #06100a;
}

.copy {
    background: #292e38;
    color: white;
    margin-left: 7px;
}

button:hover {
    opacity: 0.85;
}

@media(max-width:700px) {
    .sidebar {
        width: 70px;
    }

    .main {
        margin-left: 70px;
        padding: 20px;
    }
}
</style>

</head>

<body>

<aside class="sidebar">
    <div class="logo">ROB<span>LOX</span></div>

```
<nav class="nav">
    <a href="#" class="active">📊 Dashboard</a>
    <a href="#servers">🟢 Servers</a>
    <a href="#settings">⚙️ Settings</a>
</nav>
```

</aside>

<main class="main">

```
<div class="header">
    <h1>🎯 Rich Server Finder</h1>
    <p>Adopt Me server dashboard</p>
</div>

<div class="search-box">
    <input
        id="search"
        type="text"
        placeholder="Search player or server ID..."
        oninput="searchServers()">
</div>

<section id="servers">

    <div class="server">
        <div class="server-title">
            <h2>🐶 Rich Server Detected!</h2>
            <span class="rich">RICH SERVER</span>
        </div>

        <div class="info">
            <b>Game:</b> Adopt Me!<br>
            <b>Server ID:</b>
            <span class="server-id">
                DEMO-SERVER-001
            </span>
        </div>

        <div class="players">
            <div class="player">
                👤 PlayerOne —
                <span class="value">4.95 Value</span>
            </div>

            <div class="player">
                👤 PlayerTwo —
                <span class="value">2.39 Value</span>
            </div>
        </div>

        <div class="actions">
            <button class="join" onclick="joinGame()">
                🎮 Join Server
            </button>

            <button class="copy" onclick="copyID('DEMO-SERVER-001')">
                📋 Copy ID
            </button>
        </div>
    </div>

</section>
```

</main>

<script>

function joinGame() {
    alert("Join Server button works!");
}

function copyID(id) {
    navigator.clipboard.writeText(id)
        .then(function() {
            alert("Server ID copied!");
        })
        .catch(function() {
            alert("Could not copy the ID.");
        });
}

function searchServers() {
    const search =
        document.getElementById("search").value.toLowerCase();

    const servers =
        document.querySelectorAll(".server");

    servers.forEach(function(server) {
        const text = server.innerText.toLowerCase();

        server.style.display =
            text.includes(search) ? "block" : "none";
    });
}

</script>

</body>
</html>
