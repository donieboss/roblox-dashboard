<body>

<div class="header">

    <div class="logo">
        <span>DONIE</span>
    </div>

    <div class="subtitle">
        Find busy Roblox servers instantly
    </div>

    <div class="live">
        <span class="dot"></span>
        LIVE SERVER SCANNER
    </div>

</div>

<div class="controls">

    <div class="count" id="serverCount">
        🔄 Scanning servers...
    </div>

    <button class="refresh" onclick="loadServers()">
        🔄 Scan Servers
    </button>

</div>

<div id="serverList">

    <div class="loading">
        <div class="spinner"></div>
        Finding rich servers...
    </div>

</div>

<script>

const WORKER_URL =
    "https://red-mouse-29f4.redonekowaithe1.workers.dev";

const PLACE_ID =
    "920587237";

const MIN_PLAYERS = 20;

function calculateValue(server) {

    const players =
        Number(server.playing || 0);

    const max =
        Number(server.maxPlayers || 0);

    if (!max) {
        return players.toFixed(2);
    }

    const fullness =
        players / max;

    return (
        players * 0.08 +
        fullness * 5
    ).toFixed(2);
}

async function loadServers() {

    const list =
        document.getElementById("serverList");

    const count =
        document.getElementById("serverCount");

    count.textContent =
        "🔄 Scanning servers...";

    list.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Finding rich Roblox servers...
        </div>
    `;

    try {

        const response =
            await fetch(
                `${WORKER_URL}/servers?placeId=${PLACE_ID}`
            );

        if (!response.ok) {
            throw new Error(
                `Worker returned HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        let allServers =
            Array.isArray(data.data)
                ? data.data
                : [];

        let servers =
            allServers.filter(server =>
                Number(server.playing || 0)
                >= MIN_PLAYERS
            );

        servers.sort((a, b) =>
            Number(b.playing || 0)
            -
            Number(a.playing || 0)
        );

        count.textContent =
            `🟢 ${servers.length} rich servers found`;

        if (servers.length === 0) {

            list.innerHTML = `
                <div class="loading">

                    ⚠️ No 20+ player servers
                    found right now.

                    <br><br>

                    Worker returned
                    ${allServers.length}
                    servers.

                    <br><br>

                    <button
                        class="refresh"
                        onclick="loadServers()"
                    >
                        🔄 Scan Again
                    </button>

                </div>
            `;

            return;
        }

        list.innerHTML = "";

        servers.forEach((server, index) => {

            const players =
                Number(server.playing || 0);

            const maxPlayers =
                Number(server.maxPlayers || 0);

            const ping =
                server.ping !== undefined
                    ? Math.round(Number(server.ping))
                    : "N/A";

            const fps =
                server.fps !== undefined
                    ? Math.round(Number(server.fps))
                    : "N/A";

            const value =
                calculateValue(server);

            const card =
                document.createElement("div");

            card.className = "server";

            const badge =
                document.createElement("div");

            badge.className = "badge";

            badge.textContent =
                index === 0
                    ? "🔥 BEST SERVER"
                    : "🟢 RICH SERVER DETECTED";

            const top =
                document.createElement("div");

            top.className = "server-top";

            const title =
                document.createElement("div");

            title.className = "server-title";

            title.textContent =
                `🎮 Server #${index + 1}`;

            const playerText =
                document.createElement("div");

            playerText.className = "players";

            playerText.textContent =
                `👥 ${players}/${maxPlayers}`;

            top.appendChild(title);
            top.appendChild(playerText);

            const valueBox =
                document.createElement("div");

            valueBox.className = "value-box";

            valueBox.innerHTML = `
                <div class="value-label">
                    Server Value
                </div>

                <div class="value">
                    💎 ${value}
                </div>
            `;

            const full =
                document.createElement("div");

            full.className = "full";

            full.textContent =
                players >= maxPlayers
                    ? "🔥 SERVER IS FULL"
                    : "🟢 Rich Server Detected";

            const stats =
                document.createElement("div");

            stats.className = "stats";

            stats.innerHTML = `

                <div class="stat">
                    <div class="stat-label">
                        PLAYERS
                    </div>
                    <div class="stat-value">
                        👥 ${players}
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        PING
                    </div>
                    <div class="stat-value">
                        📡 ${ping} ms
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        FPS
                    </div>
                    <div class="stat-value">
                        ⚡ ${fps}
                    </div>
                </div>

            `;

            const idBox =
                document.createElement("div");

            idBox.className = "server-id";

            idBox.innerHTML = `

                <div class="server-id-label">
                    SERVER ID
                </div>

                <div class="server-id-value"></div>

            `;

            idBox.querySelector(
                ".server-id-value"
            ).textContent =
                server.id || "Unknown";

            const join =
                document.createElement("button");

            join.className = "join";

            join.textContent =
                "🚀 JOIN THIS SERVER";

            join.onclick = () =>
                joinServer(server.id);

            card.appendChild(badge);
            card.appendChild(top);
            card.appendChild(valueBox);
            card.appendChild(full);
            card.appendChild(stats);
            card.appendChild(idBox);
            card.appendChild(join);

            list.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        count.textContent =
            "❌ Scanner error";

        list.innerHTML = `

            <div class="loading">

                ❌ Could not load servers.

                <br><br>

                ${error.message}

                <br><br>

                <button
                    class="refresh"
                    onclick="loadServers()"
                >
                    🔄 Try Again
                </button>

            </div>

        `;

    }
}

function joinServer(serverId) {

    if (!serverId) {

        alert("Server ID is missing.");

        return;

    }

    const link =
        `roblox://placeId=${PLACE_ID}&gameInstanceId=${encodeURIComponent(serverId)}`;

    window.location.href =
        link;
}

loadServers();

setInterval(
    loadServers,
    30000
);

</script>

</body>
</html>
