/* =========================================
   VALUE PARSER
   Supports:
   17000
   "17000"
   "$17,000"
   "17K"
   "17k"
   "17 K"
   "$17K"
   "17.5K"
   "$17.5K"
   "1.2M"
   "$1.2M"
   "2B"
   "$17,000 USD"
========================================= */

function parseValue(value) {

  if (value === null || value === undefined) {
    return 0;
  }

  if (typeof value === "number") {
    return Number.isFinite(value) ? value : 0;
  }

  let s = String(value)
    .trim()
    .toUpperCase();

  if (!s) {
    return 0;
  }

  /* Remove currency / formatting text */
  s = s
    .replace(/\$/g, "")
    .replace(/,/g, "")
    .replace(/\s+/g, "")
    .replace(/USD$/i, "");

  if (!s) {
    return 0;
  }

  /*
    Match:
    17000
    17K
    17.5K
    1.2M
    2B
  */
  const match = s.match(
    /^([-+]?(?:\d+(?:\.\d*)?|\.\d+))(K|M|B)?$/
  );

  if (!match) {

    /*
      Fallback for strings such as:
      "$17,000 USD value"
    */
    const fallbackMatch = s.match(
      /[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:K|M|B)?/
    );

    if (!fallbackMatch) {
      return 0;
    }

    return parseValue(fallbackMatch[0]);
  }

  let number = Number(match[1]);

  if (!Number.isFinite(number)) {
    return 0;
  }

  const suffix = match[2];

  if (suffix === "K") {
    number *= 1000;
  }

  else if (suffix === "M") {
    number *= 1000000;
  }

  else if (suffix === "B") {
    number *= 1000000000;
  }

  return Number.isFinite(number)
    ? number
    : 0;
}

function esc(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char])
    );

}

function valueOf(server) {

  if (!server || typeof server !== "object") {
    return 0;
  }

  const fields = [
    server.adoptMeValue,
    server.adoptMeInventoryValue,
    server.inventoryValue,
    server.totalInventoryValue,
    server.reportedValue,
    server.value,
    server.rap,
    server.RAP
  ];

  for (const field of fields) {

    const parsed = parseValue(field);

    if (parsed > 0) {
      return parsed;
    }

  }

  return 0;
}

function log(message, type = "info") {

  const container = $("log");

  if (!container) {
    return;
  }

  const line = document.createElement("div");

  const time =
    new Date().toLocaleTimeString();

  let cls = "log-info";

  if (type === "ok") {
    cls = "log-ok";
  }

  else if (type === "error") {
    cls = "log-error";
  }

  else if (type === "warn") {
    cls = "log-warn";
  }

  line.className =
    "log-line " + cls;

  line.innerHTML =
    `<span class="log-time">[${esc(time)}]</span> ${esc(message)}`;

  container.appendChild(line);

  container.scrollTop =
    container.scrollHeight;

}

  const topStatus = $("topStatus");

      "online",
      online

async function checkWorker() {

  try {

    const response =
      await fetch(
        `${WORKER_URL}/health?t=${Date.now()}`,
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        `Health HTTP ${response.status}`
      );

    }

    const data =
      await response.json();

    if (!data.success) {

      throw new Error(
        data.error ||
        "Worker health check failed"
      );

    }

    setWorkerStatus(true);

    log(
      "Worker connection: ONLINE",
      "ok"
    );

    return true;

  }

  catch (error) {

    setWorkerStatus(false);

    log(
      "Worker connection failed: " +
      error.message,
      "error"
    );

    return false;

  }

}
