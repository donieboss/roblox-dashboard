
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DONIE Rich Finder</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#0b1020;
  color:white;
  min-height:100vh;
}

header{
  padding:25px;
  text-align:center;
  background:linear-gradient(135deg,#111936,#182653);
  border-bottom:1px solid #2d3b6b;
}

header h1{
  font-size:32px;
}

header p{
  color:#9fb3ff;
  margin-top:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
  padding:25px;
  max-width:1200px;
  margin:auto;
}

.stat{
  background:#121a33;
  border:1px solid #26345f;
  border-radius:15px;
  padding:20px;
}

.stat h3{
  color:#9fb3ff;
  font-size:14px;
}

.stat b{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.controls{
  max-width:1200px;
  margin:auto;
  padding:0 25px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  background:#5865F2;
  color:white;
  border:none;
  padding:12px 22px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

button:hover{
  background:#4752c4;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:0 25px 40px;
}

.server{
  background:#121a33;
  border:1px solid #26345f;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  transition:.2s;
}

.server:hover{
  transform:translateY(-2px);
  border-color:#5865F2;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.value{
  color:#ffd54a;
  font-size:24px;
  font-weight:bold;
}

.rich{
  color:#4ade80;
  font-weight:bold;
  margin-top:8px;
}

.info{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
  margin-top:18px;
}

.box{
  background:#0c1226;
  padding:12px;
  border-radius:10px;
}

.box span{
  color:#9ca3af;
  font-size:12px;
}

.box b{
  display:block;
  margin-top:4px;
}

.join{
  margin-top:16px;
  width:100%;
  background:#22c55e;
}

.join:hover{
  background:#16a34a;
}

.loading{
  text-align:center;
  padding:50px;
  color:#9fb3ff;
}

.empty{
  text-align:center;
  padding:50px;
  color:#9ca3af;
}
</style>
</head>

<body>

<header>
  <h1>💎 DONIE Rich Finder</h1>
  <p>Find the best Adopt Me rich servers instantly</p>
</header>

<section class="stats">

<div class="stat">
<h3>Servers Found</h3>
<b id="serverCount">0</b>
</div>

<div class="stat">
<h3>Best Players</h3>
<b id="bestPlayers">0</b>
</div>

<div class="stat">
<h3>Highest Value</h3>
<b id="highestValue">0</b>
</div>

</section>

<div class="controls">
  <h2>🟢 Rich Servers</h2>
  <button onclick="loadServers()">🔄 Refresh</button>
</div>

<div class="container" id="serverList">
<div class="loading">Loading servers...</div>
</div>

<script>

const WORKER_URL="PASTE_YOUR_WORKER_URL_HERE";
const PLACE_ID="920587237";

async function loadServers(){

const list=document.getElementById("serverList");

list.innerHTML='<div class="loading">Scanning rich servers...</div>';

try{

const res=await fetch(
WORKER_URL+"/servers?placeId="+PLACE_ID
);

const json=await res.json();

const servers=json.data||[];

document.getElementById("serverCount").innerText=servers.length;

if(servers.length>0){

document.getElementById("bestPlayers").innerText=
servers[0].playing+"/"+servers[0].maxPlayers;

document.getElementById("highestValue").innerText=
servers[0].value;

}else{

document.getElementById("bestPlayers").innerText="0";
document.getElementById("highestValue").innerText="0";

}

list.innerHTML="";

if(servers.length===0){

list.innerHTML='<div class="empty">No rich servers found 😭</div>';

return;

}

servers.forEach(server=>{

const card=document.createElement("div");

card.className="server";

card.innerHTML=`

<div class="top">

<div>

<h2>💎 Rich Server</h2>

<div class="rich">🟢 Rich Server Detected</div>

</div>

<div class="value">${server.value}</div>

</div>

<div class="info">

<div class="box">

<span>Players</span>

<b>${server.playing}/${server.maxPlayers}</b>

</div>

<div class="box">

<span>Ping</span>

<b>${server.ping??"N/A"} ms</b>

</div>

<div class="box">

<span>FPS</span>

<b>${server.fps??"N/A"}</b>

</div>

<div class="box">

<span>Server ID</span>

<b style="font-size:10px">${server.id}</b>

</div>

</div>

<button class="join" onclick="joinServer('${server.id}')">

🚀 Join Server

</button>

`;

list.appendChild(card);

});

}catch(err){

list.innerHTML=
'<div class="empty">Failed to load servers.</div>';

console.error(err);

}

}

function joinServer(id){

const script=
`game:GetService("TeleportService"):TeleportToPlaceInstance(${PLACE_ID},"${id}")`;

navigator.clipboard.writeText(script);

alert("Join script copied!");

}

loadServers();

setInterval(loadServers,30000);

</script>

</body>
</html>
