html <!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Adopt Me Trading Dashboard</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; } body { background: #0b0f19; color: white; min-height: 100vh; } header { background: #111827; padding: 22px 35px; border-bottom: 1px solid #263044; } header h1 { font-size: 25px; } header p { color: #8f9bb3; margin-top: 6px; } .container { max-width: 1100px; margin: 35px auto; padding: 0 20px; } .top-card, .server-card, .empty { background: #111827; border: 1px solid #263044; border-radius: 16px; } .top-card { padding: 25px; margin-bottom: 25px; } .top-card h2 { margin-bottom: 10px; } .description { color: #8f9bb3; } .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; } input { background: #080c14; color: white; border: 1px solid #303b52; padding: 13px; border-radius: 9px; outline: none; width: 180px; } button { border: none; border-radius: 9px; padding: 13px 18px; font-weight: bold; cursor: pointer; } .find-btn { background: #5865f2; color: white; } .server-list { display: grid; gap: 18px; } .server-card { padding: 22px; } .player { font-size: 20px; font-weight: bold; } .value { color: #8b9cff; font-size: 18px; margin-left: 8px; } .status { display: inline-block; margin-top: 14px; padding: 7px 11px; border-radius: 20px; background: #123b29; color: #5dff9a; font-size: 13px; font-weight: bold; } .details { margin-top: 17px; color: #aab4c7; line-height: 1.8; } .server-id { background: #080c14; padding: 10px; border-radius: 7px; color: #d7def0; word-break: break-all; margin-top: 5px; } .join { margin-top: 18px; background: #20c77a; color: #06130c; width: 100%; } .join:hover { background: #35e58f; } .empty { display: none; text-align: center; color: #8f9bb3; padding: 40px; } .loading { text-align: center; color: #8f9bb3; padding: 40px; } .note { margin-top: 20px; color: #78849b; font-size: 13px; } </style> </head> <body> <header> <h1>🎮 Adopt Me Trading Dashboard</h1> <p>High-value trading server finder</p> </header> <div class="container"> <div class="top-card"> <h2>🎯 High Value Servers</h2> <p class="description"> Find servers meeting your minimum value. </p> <div class="controls"> <input id="minimumValue" type="number" min="0" step="0.01" value="2.00" placeholder="Minimum value" > <button type="button" class="find-btn" onclick="findServers()" > 🔎 Find High Value Servers </button> </div> <p class="note"> Only servers supplied by the configured server source are displayed. </p> </div> <div id="serverList" class="server-list"> <div class="loading"> 🔄 Loading servers... </div> </div> <div id="empty" class="empty"> ❌ No high-value servers found. </div> </div> <script> const PLACE_ID = "920587237"; /* * IMPORTANT: * * GitHub Pages cannot directly discover Roblox server * instances and determine which ones are "rich". * * Put your own legitimate server-data API here. * * The API should return JSON like: * * { * "servers": [ * { * "player": "@Trader", * "value": 4.95, * "game": "Adopt Me", * "serverId": "REAL_SERVER_INSTANCE_ID" * } * ] * } * * Leave this empty until your API is ready. */ const SERVER_API_URL = ""; /* ================================ LOAD SERVER DATA ================================ */ async function loadServers() { const list = document.getElementById("serverList"); const empty = document.getElementById("empty"); list.innerHTML = ` <div class="loading"> 🔄 Loading real server data... </div> `; empty.style.display = "none"; if (!SERVER_API_URL) { list.innerHTML = ` <div class="loading"> ⚠️ Server API is not configured yet. <br><br> Add your legitimate server-data API URL to <strong>SERVER_API_URL</strong>. </div> `; return; } try { const response = await fetch(SERVER_API_URL); if (!response.ok) { throw new Error("Server API request failed."); } const data = await response.json(); if (!Array.isArray(data.servers)) { throw new Error("Invalid server data."); } window.servers = data.servers; findServers(); } catch (error) { console.error(error); list.innerHTML = ` <div class="loading"> ❌ Could not load server data. <br><br> Check your server API. </div> `; } } /* ================================ FILTER SERVERS ================================ */ function findServers() { const input = document.getElementById("minimumValue"); const minimum = parseFloat(input.value) || 0; const list = document.getElementById("serverList"); const empty = document.getElementById("empty"); const servers = Array.isArray(window.servers) ? window.servers : []; list.innerHTML = ""; const filtered = servers .filter(server => Number(server.value) >= minimum && server.serverId ) .sort((a, b) => Number(b.value) - Number(a.value) ); if (filtered.length === 0) { empty.style.display = "block"; return; } empty.style.display = "none"; filtered.forEach(server => { const card = document.createElement("div"); card.className = "server-card"; const player = escapeHTML(server.player || "Unknown"); const game = escapeHTML(server.game || "Adopt Me"); const serverId = escapeHTML(server.serverId); const value = Number(server.value || 0).toFixed(2); card.innerHTML = ` <div class="player"> 👤 ${player} <span class="value"> ${value} Value </span> </div> <div class="status"> 🟢 Server Available </div> <div class="details"> 🎮 Game: <strong>${game}</strong> <br> 🆔 Server ID: <div class="server-id"> ${serverId} </div> </div> <button type="button" class="join" onclick="joinRobloxServer('${escapeJS(server.serverId)}')" > 🚀 JOIN SERVER </button> `; list.appendChild(card); }); } /* ================================ JOIN ROBLOX SERVER ================================ */ function joinRobloxServer(serverId) { if (!serverId) { alert("No valid server ID was supplied."); return; } const robloxLink = "roblox://placeId=" + PLACE_ID + "&gameInstanceId=" + encodeURIComponent(serverId); window.location.href = robloxLink; } /* ================================ SECURITY HELPERS ================================ */ function escapeHTML(value) { return String(value) .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } function escapeJS(value) { return String(value) .replace(/\\/g, "\\\\") .replace(/'/g, "\\'"); } /* ================================ START ================================ */ window.servers = []; loadServers(); </script> </body> </html>
