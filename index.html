<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>DONIE Rich Finder</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at top,
      #202040,
      #07070c 60%
    );

  min-height: 100vh;
}


/* HEADER */

header {
  text-align: center;

  padding:
    45px 20px 35px;

  background:
    rgba(7, 7, 14, .9);

  border-bottom:
    1px solid #29293a;
}

.logo {
  font-size: 48px;
  font-weight: 900;
}

.subtitle {
  color: #999;
  margin-top: 8px;
}


/* CONTAINER */

.container {
  width: 92%;
  max-width: 1250px;
  margin: 30px auto;
}


/* BUTTONS */

button {
  border: 0;

  border-radius: 10px;

  padding:
    12px 18px;

  color: white;

  background: #5865f2;

  font-weight: bold;

  cursor: pointer;
}

button:hover {
  opacity: .85;
}

.green {
  background: #00a86b;
}

.red {
  background: #d63b3b;
}


/* CONTROLS */

.controls {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-bottom: 20px;
}


/* STATUS */

.status {
  padding: 16px;

  margin-bottom: 20px;

  border:
    1px solid #29293a;

  border-radius: 14px;

  background: #11111b;
}


/* SERVER GRID */

.server-grid {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(290px, 1fr)
    );

  gap: 18px;
}


/* SERVER CARD */

.card {
  background: #11111b;

  border:
    1px solid #303044;

  border-radius: 18px;

  padding: 20px;

  transition:
    transform .15s,
    border-color .15s;
}

.card:hover {
  transform:
    translateY(-3px);

  border-color:
    #5865f2;
}

.card.rich {
  border-color:
    #00e676;

  box-shadow:
    0 0 25px
    rgba(0,230,118,.08);
}


/* BADGE */

.badge {
  display: inline-block;

  padding:
    7px 12px;

  border-radius: 20px;

  background:
    #00a86b;

  font-size: 12px;

  font-weight: bold;

  margin-bottom: 15px;
}


/* STAT */

.stat {
  display: flex;

  justify-content:
    space-between;

  padding:
    11px 0;

  border-bottom:
    1px solid #292936;
}


/* JOIN */

.join {
  width: 100%;

  margin-top: 18px;

  background:
    #00a86b;
}

.preview {
  width: 100%;

  margin-top: 10px;

  background:
    #5865f2;
}


/* EMPTY */

.empty {
  text-align: center;

  padding: 50px 20px;

  background:
    #11111b;

  border-radius: 15px;

  color: #999;
}


/* MODAL */

.modal {
  position: fixed;

  inset: 0;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(0,0,0,.78);

  z-index: 9999;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;

  max-width: 700px;

  max-height: 90vh;

  overflow-y: auto;

  padding: 25px;

  border-radius: 20px;

  background:
    #11111b;

  border:
    1px solid #34344a;

  box-shadow:
    0 20px 80px
    rgba(0,0,0,.6);
}


/* MODAL HEADER */

.modal-header {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 15px;

  margin-bottom: 20px;
}

.close {
  background:
    #292936;

  font-size: 20px;

  padding:
    8px 12px;
}


/* GAME IMAGE */

.game-image {
  width: 110px;

  height: 110px;

  object-fit: cover;

  border-radius: 15px;

  border:
    1px solid #34344a;
}


/* PREVIEW TOP */

.preview-top {
  display: flex;

  gap: 18px;

  align-items: center;

  margin-bottom: 20px;
}


/* VALUE */

.value-box {
  margin:
    20px 0;

  padding: 22px;

  text-align: center;

  border:
    1px solid #00a86b;

  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #10251d,
      #0c1512
    );
}

.value-label {
  color: #aaa;

  font-size: 13px;

  text-transform:
    uppercase;

  letter-spacing:
    2px;
}

.value-number {
  margin-top: 7px;

  font-size: 38px;

  font-weight: 900;

  color:
    #00e676;
}


/* PLAYER VALUES */

.player-list {
  margin-top: 15px;
}

.player-row {
  display: flex;

  justify-content:
    space-between;

  gap: 10px;

  padding:
    12px;

  margin-bottom: 8px;

  background:
    #181824;

  border-radius:
    10px;
}

.player-value {
  color:
    #00e676;

  font-weight:
    bold;
}


/* JOIN SCRIPT */

.script {
  padding: 15px;

  background:
    #08080d;

  border:
    1px solid #292936;

  border-radius: 10px;

  overflow-x: auto;

  font-family:
    Consolas,
    monospace;

  font-size: 13px;

  color:
    #9ef7b9;
}


/* MODAL BUTTONS */

.modal-buttons {
  display: flex;

  gap: 10px;

  margin-top: 20px;

  flex-wrap: wrap;
}

.modal-buttons button {
  flex: 1;

  min-width: 180px;
}


/* MOBILE */

@media(max-width:650px) {

  .logo {
    font-size: 36px;
  }

  .preview-top {
    flex-direction:
      column;

    align-items:
      flex-start;
  }

  .player-row {
    flex-direction:
      column;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">
    🔥 DONIE
  </div>

  <div class="subtitle">
    Rich Server Finder • Discord Notifications
  </div>

</header>


<div class="container">


  <div class="controls">

    <button
      onclick="loadServers(20)"
    >
      👥 20+ Players
    </button>

    <button
      onclick="loadServers(30)"
    >
      🔥 30+ Players
    </button>

    <button
      onclick="loadServers(35)"
    >
      💎 Full Servers
    </button>

    <button
      onclick="loadServers(0)"
    >
      🔄 Show All
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    🔎 Loading servers...
  </div>


  <div
    id="serverList"
    class="server-grid"
  ></div>


</div>


<!-- PREVIEW MODAL -->

<div
  id="previewModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        🔥 SERVER PREVIEW
      </h2>

      <button
        class="close"
        onclick="closePreview()"
      >
        ✕
      </button>

    </div>


    <div
      id="previewContent"
    ></div>

  </div>

</div>


<script>


/*
 * ==============================
 * CHANGE THIS
 * ==============================
 */

const WORKER_URL =
  "https://YOUR-WORKER.workers.dev";


/*
 * ADOPT ME
 */

const PLACE_ID =
  "920587237";


let selectedServer = null;


/*
 * ==============================
 * LOAD SERVERS
 * ==============================
 */

async function loadServers(
  minimumPlayers = 20
) {

  const status =
    document.getElementById(
      "status"
    );

  const list =
    document.getElementById(
      "serverList"
    );

  status.innerHTML =
    "🔎 Finding servers...";

  list.innerHTML = "";


  try {

    const response =
      await fetch(
        `${WORKER_URL}/servers` +
        `?placeId=${PLACE_ID}` +
        `&limit=100`
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {
      throw new Error(
        result.error ||
        "Worker error"
      );
    }


    let servers =
      result.data || [];


    servers =
      servers.filter(
        server => {

          const players =
            Number(
              server.playing || 0
            );

          const max =
            Number(
              server.maxPlayers || 0
            );


          if (
            minimumPlayers === 35
          ) {

            return (
              players > 0 &&
              players === max
            );

          }


          return (
            players >=
            minimumPlayers
          );

        }
      );


    servers.sort(
      (a,b) =>
        Number(b.playing || 0) -
        Number(a.playing || 0)
    );


    status.innerHTML =
      `🟢 Found <b>${servers.length}</b> matching servers`;


    if (!servers.length) {

      list.innerHTML = `
        <div class="empty">
          ❌ No matching servers found.
        </div>
      `;

      return;
    }


    servers.forEach(
      server => {

        const players =
          Number(
            server.playing || 0
          );

        const max =
          Number(
            server.maxPlayers || 0
          );

        const rich =
          players >= 30;


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card" +
          (
            rich
              ? " rich"
              : ""
          );


        card.innerHTML = `

          <h2>
            🎮 Roblox Server
          </h2>

          <span class="badge">
            ${
              rich
                ? "🔥 RICH SERVER"
                : "SERVER"
            }
          </span>

          <div class="stat">
            <span>
              👥 Players
            </span>

            <b>
              ${players}/${max}
            </b>
          </div>

          <div class="stat">
            <span>
              📡 Ping
            </span>

            <b>
              ${server.ping ?? "N/A"} ms
            </b>
          </div>

          <div class="stat">
            <span>
              ⚡ FPS
            </span>

            <b>
              ${server.fps ?? "N/A"}
            </b>
          </div>

          <button
            class="preview"
            onclick='openPreview(
              ${JSON.stringify(server)}
            )'
          >
            👀 PREVIEW SERVER
          </button>

        `;


        list.appendChild(
          card
        );

      }
    );


  } catch(error) {

    console.error(error);

    status.innerHTML =
      "❌ Error loading servers";

    list.innerHTML = `

      <div class="empty">

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/*
 * ==============================
 * OPEN PREVIEW
 * ==============================
 */

async function openPreview(
  server
) {

  selectedServer =
    server;


  const modal =
    document.getElementById(
      "previewModal"
    );


  const content =
    document.getElementById(
      "previewContent"
    );


  modal.classList.add(
    "show"
  );


  content.innerHTML = `

    <div class="empty">
      🔎 Loading server preview...
    </div>

  `;


  try {

    /*
     * GET GAME INFO
     */

    const gameResponse =
      await fetch(
        `${WORKER_URL}/game` +
        `?placeId=${PLACE_ID}`
      );


    const gameResult =
      await gameResponse.json();


    const game =
      gameResult.game || {};


    const gameName =
      game.name ||
      "Adopt Me!";


    /*
     * GET THUMBNAIL
     */

    const imageResponse =
      await fetch(
        `${WORKER_URL}/thumbnail` +
        `?placeId=${PLACE_ID}`
      );


    const imageResult =
      await imageResponse.json();


    const thumbnail =
      imageResult.imageUrl ||
      "";


    selectedServer.gameName =
      gameName;

    selectedServer.thumbnail =
      thumbnail;


    /*
     * JOIN SCRIPT
     */

    const joinScript =
      `game:GetService("TeleportService"):TeleportToPlaceInstance(${PLACE_ID}, "${server.id}")`;


    content.innerHTML = `

      <div class="preview-top">

        ${
          thumbnail
            ? `
              <img
                class="game-image"
                src="${escapeHtml(
                  thumbnail
                )}"
              >
            `
            : ""
        }

        <div>

          <h2>
            🔥 ${escapeHtml(
              gameName
            )}
          </h2>

          <p style="color:#999">
            Place ID:
            ${PLACE_ID}
          </p>

        </div>

      </div>


      <div class="stat">
        <span>
          👥 Players
        </span>

        <b>
          ${server.playing}/
          ${server.maxPlayers}
        </b>
      </div>


      <div class="stat">
        <span>
          📡 Ping
        </span>

        <b>
          ${server.ping ?? "N/A"} ms
        </b>
      </div>


      <div class="stat">
        <span>
          ⚡ FPS
        </span>

        <b>
          ${server.fps ?? "N/A"}
        </b>
      </div>


      <div class="stat">
        <span>
          🆔 Server ID
        </span>

        <b style="
          max-width:60%;
          overflow-wrap:anywhere;
        ">
          ${escapeHtml(
            server.id
          )}
        </b>
      </div>


      <div class="value-box">

        <div class="value-label">
          💎 Server Player Value
        </div>

        <div
          class="value-number"
          id="totalValue"
        >
          Not available
        </div>

        <div style="
          color:#888;
          margin-top:8px;
        ">
          Roblox's public server list
          does not expose every player's
          inventory/RAP.
        </div>

      </div>


      <h3>
        👤 Player Values
      </h3>


      <div
        id="playerValues"
        class="player-list"
      >

        <div class="empty">

          Player value data isn't
          available from the public
          server-list response.

        </div>

      </div>


      <h3>
        📜 Join Script
      </h3>


      <div class="script">
        ${escapeHtml(
          joinScript
        )}
      </div>


      <div class="modal-buttons">

        <button
          class="green"
          onclick="sendToDiscord()"
        >
          📢 SEND TO DISCORD
        </button>

        <button
          class="green"
          onclick="joinServer()"
        >
          🚀 JOIN SERVER
        </button>

        <button
          class="red"
          onclick="closePreview()"
        >
          ❌ CLOSE
        </button>

      </div>

    `;


  } catch(error) {

    content.innerHTML = `

      <div class="empty">

        ❌ Preview error:
        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/*
 * ==============================
 * SEND DISCORD
 * ==============================
 */

async function sendToDiscord() {

  if (!selectedServer) {
    return;
  }


  const button =
    event?.target;


  if (button) {
    button.disabled = true;
    button.innerText =
      "📤 SENDING...";
  }


  try {

    const response =
      await fetch(
        `${WORKER_URL}/notify`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            placeId:
              PLACE_ID,

            serverId:
              selectedServer.id,

            playing:
              selectedServer.playing,

            maxPlayers:
              selectedServer.maxPlayers,

            ping:
              selectedServer.ping,

            fps:
              selectedServer.fps,

            gameName:
              selectedServer.gameName ||
              "Adopt Me!",

            thumbnail:
              selectedServer.thumbnail ||
              null,

            /*
             * Empty for now because
             * Roblox public server API
             * does not expose the complete
             * player inventory/RAP list.
             */

            playerValues: []

          })
        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.error ||
        "Discord notification failed."
      );

    }


    if (button) {

      button.innerText =
        "✅ SENT TO DISCORD";

      button.disabled =
        false;

    }


  } catch(error) {

    console.error(error);

    alert(
      "Discord error: " +
      error.message
    );


    if (button) {

      button.innerText =
        "📢 SEND TO DISCORD";

      button.disabled =
        false;

    }

  }

}


/*
 * ==============================
 * JOIN
 * ==============================
 */

function joinServer() {

  if (!selectedServer) {
    return;
  }


  const url =
    "https://www.roblox.com/games/start" +
    "?placeId=" +
    encodeURIComponent(
      PLACE_ID
    ) +
    "&gameInstanceId=" +
    encodeURIComponent(
      selectedServer.id
    );


  window.open(
    url,
    "_blank"
  );

}


/*
 * ==============================
 * CLOSE
 * ==============================
 */

function closePreview() {

  document
    .getElementById(
      "previewModal"
    )
    .classList.remove(
      "show"
    );

}


/*
 * ==============================
 * ESCAPE HTML
 * ==============================
 */

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/*
 * ==============================
 * START
 * ==============================
 */

loadServers(20);

</script>

</body>

</html>
