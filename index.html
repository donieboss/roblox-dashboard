<script>

/*
========================================
ROBLOX SERVER WORKER
========================================
*/

const WORKER_URL =
    "https://black-sun-c74c.redonekowaithe1.workers.dev";

const PLACE_ID = "920587237";

/* Minimum players to display */
let MIN_PLAYERS = 10;


/*
========================================
PLAYER FILTER
========================================
*/

function setPlayerFilter(amount) {

    MIN_PLAYERS = amount;

    document.querySelectorAll(".filter-btn").forEach(button => {
        button.classList.remove("active-filter");
    });

    const selected =
        document.querySelector(`[data-min="${amount}"]`);

    if (selected) {
        selected.classList.add("active-filter");
    }

    loadServers();
}


/*
========================================
LOAD SERVERS
========================================
*/

async function loadServers() {

    const list = document.getElementById("serverList");

    list.innerHTML = `
        <div class="loading">
            🔄 Loading real Roblox servers...
        </div>
    `;

    try {

        const response = await fetch(
            `${WORKER_URL}/servers?placeId=${PLACE_ID}`
        );

        if (!response.ok) {
            throw new Error(
                `Worker returned HTTP ${response.status}`
            );
        }

        const data = await response.json();

        let servers = Array.isArray(data.data)
            ? data.data
            : [];


        /*
        ONLY SHOW SERVERS WITH
        THE SELECTED MINIMUM PLAYERS.
        */

        servers = servers.filter(server => {

            const playing =
                Number(server.playing || 0);

            const maxPlayers =
                Number(server.maxPlayers || 0);

            /*
            Ignore full/invalid servers.
            */

            return (
                playing >= MIN_PLAYERS &&
                maxPlayers > 0
            );

        });


        /*
        BUSIEST SERVERS FIRST.
        */

        servers.sort((a, b) => {

            const playersA =
                Number(a.playing || 0);

            const playersB =
                Number(b.playing || 0);

            return playersB - playersA;

        });


        /*
        UPDATE DASHBOARD STATS.
        */

        document.getElementById("totalServers").textContent =
            servers.length;

        document.getElementById("adoptServers").textContent =
            servers.length;


        const totalPlayers = servers.reduce(
            (total, server) =>
                total + Number(server.playing || 0),
            0
        );


        document.getElementById("totalPlayers").textContent =
            totalPlayers;

        document.getElementById("playersFound").textContent =
            totalPlayers;


        /*
        NO MATCHES.
        */

        if (servers.length === 0) {

            list.innerHTML = `
                <div class="loading">

                    😕 No servers with
                    <strong>${MIN_PLAYERS}+</strong>
                    players were found.

                    <br><br>

                    Try a lower filter.

                </div>
            `;

            return;

        }


        /*
        CREATE SERVER CARDS.
        */

        list.innerHTML = "";


        servers.forEach((server, index) => {

            const div =
                document.createElement("div");

            div.className = "server";


            /*
            SERVER TOP.
            */

            const top =
                document.createElement("div");

            top.className = "server-top";


            const title =
                document.createElement("strong");

            title.textContent =
                index === 0
                    ? "🔥 BUSIEST SERVER"
                    : "🟢 Public Server";


            const players =
                document.createElement("span");

            players.className = "players";

            players.textContent =
                `${server.playing || 0}/${server.maxPlayers || 0} Players`;


            top.appendChild(title);
            top.appendChild(players);


            /*
            SERVER ID.
            */

            const id =
                document.createElement("div");

            id.className = "server-id";

            id.innerHTML =
                "Server ID:<br>";


            const idText =
                document.createTextNode(
                    server.id || "Unknown"
                );

            id.appendChild(idText);


            /*
            JOIN BUTTON.
            */

            const button =
                document.createElement("button");

            button.className = "join";

            button.textContent =
                "🚀 JOIN SERVER";


            button.addEventListener(
                "click",
                () => joinServer(server.id)
            );


            div.appendChild(top);

            div.appendChild(id);

            div.appendChild(button);

            list.appendChild(div);

        });


    } catch (error) {

        console.error(error);

        list.innerHTML = `

            <div class="error">

                ❌ Could not load Roblox servers.

                <br><br>

                Make sure your Cloudflare Worker
                is deployed and accessible.

                <br><br>

                <button
                    class="refresh"
                    onclick="loadServers()"
                >
                    ↻ Try Again
                </button>

            </div>

        `;

    }

}


/*
========================================
JOIN SERVER
========================================
*/

function joinServer(serverId) {

    if (!serverId) {

        alert("Server ID is missing.");

        return;

    }


    const robloxLink =
        `roblox://placeId=${PLACE_ID}&gameInstanceId=${encodeURIComponent(serverId)}`;


    window.location.href =
        robloxLink;

}


/*
========================================
NAVIGATION
========================================
*/

function showDashboard() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function showGame(game) {

    if (game === "Adopt Me") {

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    } else {

        alert(
            `${game} server support is not connected yet.`
        );

    }

}


/*
========================================
START
========================================
*/

loadServers();

</script>
