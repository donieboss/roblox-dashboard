<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DONIE Rich Finder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #22223b 0%, #09090f 45%, #050509 100%);
      color: white;
    }

    header {
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #292936;
      background: rgba(10, 10, 18, 0.8);
    }

    header h1 {
      font-size: 36px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
    }

    .container {
      width: min(1100px, 92%);
      margin: 30px auto;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #5865f2;
    }

    button:hover {
      opacity: .85;
    }

    .status {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 12px;
      background: #11111b;
      border: 1px solid #292936;
    }

    .servers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .server {
      background: rgba(18, 18, 29, .95);
      border: 1px solid #303044;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    .server.rich {
      border-color: #00e676;
      box-shadow: 0 0 25px rgba(0,230,118,.12);
    }

    .server h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #00a854;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .normal {
      background: #343440;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #272733;
    }

    .stat:last-of-type {
      border-bottom: 0;
    }

    .value {
      font-weight: bold;
    }

    .join {
      width: 100%;
      margin-top: 17px;
      background: #00a86b;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: #999;
      background: #11111b;
      border-radius: 15px;
    }

    .error {
      color: #ff6b6b;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 DONIE RICH FINDER</h1>
  <p>Find busy Roblox servers fast</p>
</header>

<div class="container">

  <div class="controls">
    <button onclick="loadServers()">🔄 Find Servers</button>
    <button onclick="setMinPlayers(20)">👥 20+ Players</button>
    <button onclick="setMinPlayers(30)">🔥 30+ Players</button>
  </div>

  <div class="status" id="status">
    Ready to find rich servers.
  </div>

  <div class="servers" id="servers">
    <div class="empty">
      Click <b>Find Servers</b> to search.
    </div>
  </div>

</div>

<footer>
  DONIE Rich Finder
</footer>

<script>
  // YOUR CLOUDFLARE WORKER URL
  const WORKER_URL =
    "https://black-sun-c74c.redonekowaithe1.workers.dev";

  const PLACE_ID = "920587237";

  let minimumPlayers = 20;

  function setMinPlayers(number) {
    minimumPlayers = number;
    loadServers();
  }

  async function loadServers() {
    const status = document.getElementById("status");
    const container = document.getElementById("servers");

    status.innerHTML = "🔎 Searching for rich servers...";
    container.innerHTML = "";

    try {
      const response = await fetch(
        WORKER_URL + "/servers"
      );

      if (!response.ok) {
        throw new Error("Worker returned " + response.status);
      }

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.error || "Unknown error");
      }

      let servers = result.data || [];

      servers = servers.filter(
        server => server.playing >= minimumPlayers
      );

      if (servers.length === 0) {
        container.innerHTML = `
          <div class="empty">
            ❌ No servers found with ${minimumPlayers}+ players.
          </div>
        `;

        status.innerHTML =
          `No ${minimumPlayers}+ player servers found.`;
        return;
      }

      status.innerHTML =
        `🟢 Found <b>${servers.length}</b> servers with ${minimumPlayers}+ players.`;

      servers.forEach(server => {
        container.appendChild(createServerCard(server));
      });

    } catch (error) {
      console.error(error);

      status.innerHTML =
        `<span class="error">❌ Could not connect to the Worker.</span>`;

      container.innerHTML = `
        <div class="empty">
          <p class="error">Worker connection failed.</p>
          <br>
          Check that your Cloudflare Worker is deployed.
        </div>
      `;
    }
  }

  function createServerCard(server) {

    const playing = Number(server.playing || 0);
    const maxPlayers = Number(server.maxPlayers || 0);

    // Simple rich-server score based on population.
    const percentage =
      maxPlayers > 0
        ? Math.round((playing / maxPlayers) * 100)
        : 0;

    const isRich = playing >= 30;

    // Display score, not an actual Roblox economy/value measurement.
    const richScore = Math.min(
      100,
      Math.round((playing / Math.max(maxPlayers, 1)) * 100)
    );

    const card = document.createElement("div");

    card.className =
      "server" + (isRich ? " rich" : "");

    card.innerHTML = `
      <h2>🎮 Roblox Server</h2>

      <span class="badge ${isRich ? "" : "normal"}">
        ${isRich ? "🟢 RICH SERVER" : "SERVER"}
      </span>

      <div class="stat">
        <span>👥 Players</span>
        <span class="value">
          ${playing}/${maxPlayers}
        </span>
      </div>

      <div class="stat">
        <span>📊 Fullness</span>
        <span class="value">
          ${percentage}%
        </span>
      </div>

      <div class="stat">
        <span>💎 Rich Score</span>
        <span class="value">
          ${richScore}/100
        </span>
      </div>

      <div class="stat">
        <span>📡 Ping</span>
        <span class="value">
          ${server.ping ?? "N/A"} ms
        </span>
      </div>

      <div class="stat">
        <span>⚡ FPS</span>
        <span class="value">
          ${server.fps ?? "N/A"}
        </span>
      </div>

      <button class="join"
        onclick="joinServer('${escapeForAttribute(server.id)}')">
        🚀 Join Server
      </button>
    `;

    return card;
  }

  function escapeForAttribute(value) {
    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  function joinServer(serverId) {

    const url =
      "https://www.roblox.com/games/start" +
      "?placeId=" + encodeURIComponent(PLACE_ID) +
      "&gameInstanceId=" + encodeURIComponent(serverId);

    window.open(url, "_blank");
  }

  // Automatically search when page opens
  loadServers();
</script>

</body>
</html>
